name: Website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'package.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'package.json'
      - '.github/workflows/website.yml'

jobs:
  build:
    name: Build (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run build
